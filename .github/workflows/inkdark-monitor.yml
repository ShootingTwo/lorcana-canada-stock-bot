name: Lorcana Canada Monitor

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: into-the-inkdark-monitor
  cancel-in-progress: false

jobs:
  check-inkdark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Lorcana Canada monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python lorcana_canada_monitor.py

      - name: Save Lorcana Canada state
        run: |
          git config user.name "Lorcana Stock Bot"
          git config user.email "actions@github.com"

          # Save the newly generated state temporarily
          cp inkdark_state.json /tmp/inkdark_state.json

          # Update the checkout to the latest version of main
          git reset --hard
          git pull --rebase origin main

          # Restore the state generated by this run
          cp /tmp/inkdark_state.json inkdark_state.json
          git add inkdark_state.json

          if git diff --cached --quiet; then
            echo "No Into the Inkdark state changes to save."
          else
            git commit -m "Update Lorcana Canada state"
            git push origin main
          fi
