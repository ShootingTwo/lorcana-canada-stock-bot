name: Lorcana Canada Monitor

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: into-the-inkdark-monitor
  cancel-in-progress: false

jobs:
  check-inkdark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Lorcana Canada monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python lorcana_canada_monitor.py

        - name: Save Lorcana Canada state
          run: |
            git config user.name "Lorcana Stock Bot"
            git config user.email "actions@github.com"
  
            cp lorcana_canada_state.json /tmp/lorcana_canada_state.json
            git reset --hard
            git pull --rebase origin main
            cp /tmp/lorcana_canada_state.json lorcana_canada_state.json
            git add lorcana_canada_state.json
  
            if git diff --cached --quiet; then
              echo "No Lorcana Canada state changes to save."
            else
              git commit -m "Update Lorcana Canada state"
              git push origin main
            fi
