name: Face to Face Lorcana Stock Checker

on:
  workflow_dispatch:
  schedule:
      - cron: "6,16,26,36,46,56 * * * *"

concurrency:
  group: facetoface-lorcana-stock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stock-checker-facetoface:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check Face to Face Games
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python stock_checker_facetoface.py

      - name: Save Face to Face stock state
        run: |
          git config user.name "Lorcana Stock Bot"
          git config user.email "actions@github.com"
          git add stock_state_facetoface.json

          if git diff --cached --quiet; then
            echo "No Face to Face stock changes to save."
          else
            git commit -m "Update Face to Face stock state"
            git push
          fi
