name: 401 Games Lorcana Stock Checker

on:
  workflow_dispatch:
  schedule:

concurrency:
  group: 401-games-stock-checker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stock-checker-401:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check 401 Games
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python stock_checker_401games.py

      - name: Save 401 Games stock state
        run: |
          git config user.name "Lorcana Stock Bot"
          git config user.email "actions@github.com"

          # Save the newly generated state temporarily
          cp stock_state_401games.json /tmp/stock_state_401games.json

          # Update the checkout to the latest version of main
          git reset --hard
          git pull --rebase origin main

          # Restore the state generated by this run
          cp /tmp/stock_state_401games.json stock_state_401games.json
          git add stock_state_401games.json

          if git diff --cached --quiet; then
            echo "No 401 Games stock changes to save."
          else
            git commit -m "Update 401 Games stock state"
            git push origin main
          fi
