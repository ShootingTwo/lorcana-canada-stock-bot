name: EB Games Hyperia City Stock Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "1,11,21,31,41,51 * * * *"

concurrency:
  group: ebgames-hyperia-stock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Check EB Games
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python stock_checker_ebgames.py

      - name: Save EB Games stock state
        run: |
          git config user.name "Lorcana Stock Bot"
          git config user.email "actions@github.com"

          # Save the newly generated state temporarily
          cp stock_state_ebgames.json /tmp/stock_state_ebgames.json

          # Update to the latest version of main
          git reset --hard
          git pull --rebase origin main

          # Restore the state generated by this run
          cp /tmp/stock_state_ebgames.json stock_state_ebgames.json
          git add stock_state_ebgames.json

          if git diff --cached --quiet; then
            echo "No EB Games stock changes to save."
          else
            git commit -m "Update EB Games stock state"
            git push origin main
          fi
