name: Hobbiesville Lorcana Stock Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "0,10,20,30,40,50 * * * *"

concurrency:
  group: hobbiesville-lorcana-stock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stock-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check Hobbiesville
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python stock_checker.py

      - name: Save stock state
        run: |
          git config user.name "Lorcana Stock Bot"
          git config user.email "actions@github.com"

          # Save the newly generated state temporarily
          cp stock_state.json /tmp/stock_state.json

          # Update the checkout to the latest version of main
          git reset --hard
          git pull --rebase origin main

          # Restore the state generated by this run
          cp /tmp/stock_state.json stock_state.json
          git add stock_state.json

          if git diff --cached --quiet; then
            echo "No stock changes to save."
          else
            git commit -m "Update Hobbiesville stock state"
            git push origin main
          fi
