name: Canada Lorcana Discovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canada-lorcana-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Canada Lorcana discovery
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python canada_discovery.py

      - name: Save Canada discovery state
        run: |
          git config user.name "Lorcana Stock Bot"
          git config user.email "actions@github.com"

          cp canada_discovery_state.json /tmp/canada_discovery_state.json

          git reset --hard
          git pull --rebase origin main

          cp /tmp/canada_discovery_state.json canada_discovery_state.json
          git add canada_discovery_state.json

          if git diff --cached --quiet; then
            echo "No Canada discovery state changes to save."
          else
            git commit -m "Update Canada discovery state"
            git push origin main
          fi
